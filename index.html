<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>АП591 · Расписание</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="page">

    <header class="topbar">
        <div class="topbar-row">
        <div class="brand">
            <span class="brand-code">АП591</span>
            <span class="brand-sub">Расписание занятий</span>
        </div>
        <button id="themeToggle" class="icon-btn" aria-label="Сменить тему" title="Сменить тему">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
        </button>
        </div>

        <div class="week-switch" id="weekSwitch" role="tablist" aria-label="Выбор недели">
        <button type="button" data-week="1" role="tab">1 нед.</button>
        <button type="button" data-week="2" role="tab">2 нед.</button>
        <button type="button" data-week="3" role="tab">3 нед.</button>
        <button type="button" data-week="4" role="tab">4 нед.</button>
        </div>

        <div class="day-switch" id="daySwitch" role="tablist" aria-label="Выбор дня"></div>

        <div class="subgroup-switch" id="subgroupSwitch" role="tablist" aria-label="Выбор подгруппы">
        <button type="button" data-subgroup="all" role="tab">Вся группа</button>
        <button type="button" data-subgroup="1" role="tab">Подгруппа 1</button>
        <button type="button" data-subgroup="2" role="tab">Подгруппа 2</button>
        </div>
    </header>

    <main class="content">
        <div class="day-heading" id="dayHeading"></div>
        <section class="ticket-list" id="scheduleList"></section>

        <section class="announcements">
        <h2 class="section-title">Объявления</h2>
        <div id="announceList" class="announce-list"></div>
        </section>
    </main>

    <footer class="foot-note">БГАС · группа АП591</footer>
    </div>

    <button id="adminFab" class="admin-fab" aria-label="Админ-панель" title="Админ-панель">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
    </button>

    <!-- LOGIN MODAL -->
    <div id="loginModal" class="modal-backdrop hidden">
    <div class="modal">
        <div class="modal-head">
        <h3>Вход в админку</h3>
        <button class="modal-close" data-close="loginModal" aria-label="Закрыть">✕</button>
        </div>
        <div class="modal-body">
        <label class="field">
            <span>Логин</span>
            <input id="loginUser" type="text" autocomplete="username">
        </label>
        <label class="field">
            <span>Пароль</span>
            <input id="loginPass" type="password" autocomplete="current-password">
        </label>
        <p id="loginError" class="error hidden">Неверный логин или пароль</p>
        </div>
        <div class="modal-actions">
        <button class="btn btn-ghost" data-close="loginModal">Отмена</button>
        <button class="btn btn-primary" id="loginSubmit">Войти</button>
        </div>
    </div>
    </div>

    <!-- ADMIN MODAL -->
    <div id="adminModal" class="modal-backdrop hidden">
    <div class="modal modal-large">
        <div class="modal-head">
        <h3>Админ-панель</h3>
        <button class="modal-close" data-close="adminModal" aria-label="Закрыть">✕</button>
        </div>

        <div class="admin-tabs" role="tablist">
        <button type="button" class="admin-tab active" data-tab="lessons">Пары</button>
        <button type="button" class="admin-tab" data-tab="announce">Объявления</button>
        <button type="button" class="admin-tab" data-tab="settings">Настройки</button>
        </div>

        <div class="modal-body">

        <!-- LESSONS TAB -->
        <div class="admin-panel" id="panel-lessons">
            <div class="admin-day-filter" id="adminDayFilter"></div>
            <div id="lessonsEditList" class="lesson-edit-list"></div>
            <button class="btn btn-primary btn-block" id="addLessonBtn">+ Добавить пару</button>
        </div>

        <!-- ANNOUNCEMENTS TAB -->
        <div class="admin-panel hidden" id="panel-announce">
            <label class="field">
            <span>Текст объявления</span>
            <textarea id="newAnnounceText" rows="3" placeholder="Например: в пятницу 3-я пара переносится..."></textarea>
            </label>
            <button class="btn btn-primary btn-block" id="addAnnounceBtn">Опубликовать</button>
            <div id="adminAnnounceList" class="admin-announce-list"></div>
        </div>

        <!-- SETTINGS TAB -->
        <div class="admin-panel hidden" id="panel-settings">
            <h4 class="settings-sub">Сменить логин / пароль</h4>
            <label class="field">
            <span>Новый логин</span>
            <input id="newLogin" type="text">
            </label>
            <label class="field">
            <span>Новый пароль</span>
            <input id="newPass" type="password">
            </label>
            <button class="btn btn-primary btn-block" id="saveCredsBtn">Сохранить</button>

            <h4 class="settings-sub">Резервная копия</h4>
            <p class="hint">Все данные хранятся в этом браузере. Сделайте копию, чтобы не потерять расписание.</p>
            <div class="settings-row">
            <button class="btn btn-ghost" id="exportBtn">Экспорт JSON</button>
            <button class="btn btn-ghost" id="importBtn">Импорт JSON</button>
            </div>
            <textarea id="backupArea" rows="4" class="hidden" placeholder="Вставьте сюда JSON и нажмите «Импорт JSON» ещё раз"></textarea>

            <h4 class="settings-sub">Сброс</h4>
            <button class="btn btn-danger btn-block" id="resetBtn">Восстановить исходное расписание</button>

            <button class="btn btn-ghost btn-block" id="logoutBtn">Выйти из админки</button>
        </div>

        </div>
    </div>
    </div>

    <div id="toast" class="toast hidden"></div>

    <script src="script.js"></script>
</body>
</html>
